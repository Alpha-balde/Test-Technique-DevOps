# Local run only (not used by Terraform).
# Usage: copy .env.example to .env, set POSTGRES_PASSWORD, then `docker compose up --build`.
name: deploy-requests

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deployrequests
      POSTGRES_USER: deployrequests
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432" # loopback only, for `dotnet run` / debugging
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployrequests -d deployrequests"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    image: deploy-requests:local
    environment:
      ConnectionStrings__Database: "Host=db;Port=5432;Database=deployrequests;Username=deployrequests;Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
